<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Archive Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Comp F: one line that splits into local / AWS tracks exactly where the code differs.
   Generated by build_archive_motion.py; edit the template, not the output. */
:root{
  --bg:#0b0805; --bg2:#120c06; --panel:#140e07; --ink:#ffc233; --dim:#a8782a; --faint:#4a3413;
  --hot:#ffe08a; --rust:#e0602c; --line:#7a5418; --glow:0 0 12px #ffb00055;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --yl:24%; --ym:50%; --ya:76%;   /* track heights: local, merged, AWS */
  --cw:46px; --jw:22px;           /* collapsed station, junction */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--mono);overflow:hidden}

/* ── the strip ─────────────────────────────────────────── */
#strip{position:fixed;inset:0 0 64px 0;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.col,.jn{position:relative;height:100%;flex:none}
.jn{width:var(--jw)}
.col{flex:0 0 var(--cw);transition:flex .55s cubic-bezier(.4,0,.2,1);cursor:pointer;min-width:0}
.col.on{flex:1 0 0;min-width:560px;cursor:default}
body.over .col{flex:1 0 0;min-width:0}
svg.trk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.trk path{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}
.lit{stroke:var(--ink);filter:drop-shadow(0 0 4px #ffb000aa)}
.off{stroke:var(--faint)}
.sh{stroke:var(--ink)}
.stop{position:absolute;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);transition:opacity .3s}
.stop.dim{border-color:var(--faint)}
.num{position:absolute;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);top:calc(var(--ym) + 14px)}
.col.split .num{top:calc(var(--ya) + 16px)}
.name{position:absolute;left:4px;right:4px;text-align:center;font-size:11px;color:var(--dim);top:calc(var(--ya) + 34px);opacity:0;transition:opacity .3s}
body.over .name{opacity:1}
.col.on .num,.col.on .stop,.col.on .name{opacity:0}
.lanelab{position:absolute;left:10px;font-size:10px;letter-spacing:.16em;color:var(--dim)}

/* the opened station: three bands across both tracks */
.panel{position:absolute;inset:16px 10px;display:grid;grid-template-rows:auto auto auto;align-content:space-evenly;gap:10px;opacity:0;pointer-events:none;transition:opacity .35s}
.col.on .panel{opacity:1;pointer-events:auto;transition-delay:.45s}
.band{background:var(--panel);border:2px solid var(--line);padding:10px 14px;box-shadow:6px 6px 0 #000}
.band.mid{border-color:var(--ink);overflow:auto;max-height:64vh;box-shadow:6px 6px 0 #000,0 0 30px #ffb0001c}
.band.side{display:flex;gap:12px;align-items:baseline;font-size:12.5px;color:var(--dim);transition:border-color .3s,color .3s}
.band.side b{color:var(--ink);font-weight:500}
.band.side .who{font-size:10px;letter-spacing:.16em;flex:none;width:44px}
.band.side.act{border-color:var(--ink);color:var(--ink)}
.band.shared{justify-content:center;border-style:dashed;border-color:var(--line);color:var(--dim);font-size:12.5px}
.band.shared b{color:var(--ink);font-weight:500}
.kick{display:flex;gap:12px;align-items:baseline;color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.kick b{font-size:34px;line-height:1;color:var(--ink);letter-spacing:0;text-shadow:var(--glow)}
.def{color:var(--hot);margin:8px 0 2px}
h2{font-size:22px;line-height:1.2;margin:4px 0 10px;text-shadow:var(--glow)}
.tiny{font-size:11.5px;color:var(--dim);margin:8px 0 0}
.r{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.col.on .r{opacity:1;transform:none;transition-delay:calc(var(--d,0) * 1s + .6s)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px}
.card{min-height:54px;padding:4px 5px;border:1px solid var(--line);font-size:9.5px;line-height:1.25;color:var(--dim);background:var(--bg2)}
.card .k{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.card.bridge{border-color:var(--ink);color:var(--ink);box-shadow:0 0 10px #ffb00055}
.card.planted{border-color:var(--rust);color:var(--rust)}
.card.decoy{border-style:dashed;color:#c9a050}
.card.quiet{border-color:#c9a050;border-style:double;border-width:3px;color:#e7c27a}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--line);margin-right:5px;vertical-align:-1px}
.legend i.b{border-color:var(--ink);background:#ffb00033}.legend i.p{border-color:var(--rust)}.legend i.d{border-style:dashed}.legend i.q{border:3px double #c9a050}
pre.term{margin:0;padding:10px 12px;background:#000;border:1px solid var(--line);color:var(--ink);font:12px/1.5 var(--mono);white-space:pre-wrap}
pre.term .c{color:var(--dim)}
.bars{display:grid;grid-template-columns:96px 1fr 46px;gap:6px 10px;align-items:center;font-size:11.5px}
.track{height:15px;background:#000;border:1px solid var(--line);position:relative}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--dim);transition:width .9s cubic-bezier(.2,.8,.2,1) .8s}
.col.on .fill{width:var(--w)}
.fill.bridge{background:var(--ink);box-shadow:0 0 8px #ffb00088}.fill.planted{background:var(--rust)}
.gate{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center}
.wall{height:150px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--dim);background:repeating-linear-gradient(0deg,#0000 0 9px,#ffb0000d 9px 10px)}
.doc{font-size:10.5px;padding:3px 6px;border:1px solid var(--line);margin:0 0 4px;background:var(--bg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc.bad{border-color:var(--rust);color:var(--rust)}
.stamp{display:inline-block;padding:4px 10px;border:3px solid var(--rust);color:var(--rust);font-weight:700;letter-spacing:.12em;transform:rotate(-4deg);font-size:12px}
.col.on .stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d,0) * 1s + .6s)}
@keyframes stamp{from{transform:rotate(-4deg) scale(2.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.row{display:flex;gap:10px;font-size:11.5px;padding:4px 6px;border-bottom:1px dotted var(--line)}
.row .id{color:var(--dim);width:96px;flex:none}.row.w{color:var(--rust)}
mark{background:none;color:var(--hot);border-bottom:2px solid var(--ink);text-shadow:var(--glow)}
.files{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.files span{font-size:10.5px;padding:3px 7px;border:1px solid var(--line)}.files span.hot{border-color:var(--ink)}
.big{font-size:44px;line-height:1;text-shadow:var(--glow)}
.tip{border-bottom:1px dotted var(--rust);cursor:help}
#tipbox{position:fixed;z-index:80;max-width:340px;padding:10px 12px;background:#000;border:1px solid var(--ink);font-size:12px;line-height:1.45;display:none;pointer-events:none}

/* the token: the query, riding the lit track */
#token{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--hot);box-shadow:0 0 16px 6px #ffb000aa;z-index:40;pointer-events:none;
  transition:left .55s cubic-bezier(.4,0,.2,1),top .45s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;animation:node 1.6s ease-in-out infinite}
@keyframes node{0%,100%{transform:scale(1);box-shadow:0 0 14px 4px #ffb000aa}50%{transform:scale(1.35);box-shadow:0 0 30px 12px #ffb000dd,0 0 60px 20px #ffb00044}}
@media (prefers-reduced-motion:reduce){#token{animation:none}}
/* a slow, fading block cursor: the terminal waiting on the open stop */
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:.25em;vertical-align:-.15em;background:var(--ink);
  box-shadow:0 0 8px #ffb000aa;opacity:0;animation:cur 2.2s ease-in-out infinite}
.col:not(.on) .cur{animation:none;opacity:0}
@keyframes cur{0%,100%{opacity:.9}50%{opacity:.08}}
@media (prefers-reduced-motion:reduce){.cur{animation:none;opacity:.7}}

/* ── controls ──────────────────────────────────────────── */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#000;border-top:1px solid var(--line);z-index:60}
#bar button{font:500 13px var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 13px;cursor:pointer}
#bar button:hover{border-color:var(--ink)}
#bar button.pulse{animation:pulse 1.2s infinite;border-color:var(--ink)}
@keyframes pulse{50%{box-shadow:0 0 18px #ffb000aa}}
#hint{flex:1;text-align:center;font-size:11px;color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
label.chk input{display:none}
label.chk span{width:16px;height:16px;border:1px solid var(--dim);display:inline-block;position:relative}
label.chk input:checked+span{background:var(--ink)}
label.chk input:checked+span::after{content:"";position:absolute;inset:3px;background:#000;clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%)}
#start{position:fixed;inset:0;z-index:62;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,#1a1006 0%,#0b0805 70%);text-align:center;padding:24px}
#start h1{font-size:36px;margin:0;text-shadow:var(--glow)}
#start .cur{animation:cur 2.2s ease-in-out infinite}
#start p{max-width:640px;color:var(--dim);margin:0}
#start .go{display:flex;gap:22px}
#start button{font:700 15px var(--mono);padding:13px 20px;background:var(--ink);color:#000;border:0;box-shadow:6px 6px 0 var(--rust);cursor:pointer}
#start button.alt{background:transparent;color:var(--ink);border:1px solid var(--ink);box-shadow:none}
#goResume{font-size:12px!important;padding:8px 14px!important;color:var(--dim)!important;border-color:var(--line)!important}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.col,.r,.fill,#token{transition:none!important}.col.on .stamp{animation:none}}

/* TARGET ACQUIRED: a faded stamp, not a bright one */
.stamp.faded{border-color:rgba(168,120,42,.55);color:rgba(168,120,42,.75);text-shadow:none;box-shadow:none}
/* The acquisition line, verbatim from web/index.html (the HUD): slow fade in, two 120 ms flickers, hold,
   fade to a 35% glow, then a 5,2 s loop. Starts once the target stop has opened. */
.jday{color:#ff6a4d;opacity:0;text-shadow:0 0 8px rgba(255,106,77,.75);font-size:16px;letter-spacing:.06em;margin:16px 0 0}
.col.on .jday{animation:jday 6.34s linear 1.4s 1 forwards,jdayloop 5.2s linear 7.74s infinite}
@keyframes jdayloop{
  0%{opacity:.35;text-shadow:0 0 3px rgba(255,106,77,.25);animation-timing-function:ease-in}
  23%{opacity:1;text-shadow:0 0 9px rgba(255,106,77,.8)}
  23.1%{opacity:.12}25.4%{opacity:.12}25.5%{opacity:1}27.8%{opacity:1}27.9%{opacity:.12}30.2%{opacity:.12}30.3%{opacity:1}
  61%{opacity:1;text-shadow:0 0 9px rgba(255,106,77,.8);animation-timing-function:ease-out}
  100%{opacity:.35;text-shadow:0 0 3px rgba(255,106,77,.25)}}
@keyframes jday{
  0%{opacity:0;text-shadow:0 0 0 rgba(255,106,77,0);animation-timing-function:ease-in}
  25.2%{opacity:1;text-shadow:0 0 9px rgba(255,106,77,.8)}
  25.3%{opacity:.12}26.1%{opacity:.12}26.2%{opacity:1}27.1%{opacity:1}27.2%{opacity:.12}28.0%{opacity:.12}28.1%{opacity:1}
  68.5%{opacity:1;text-shadow:0 0 9px rgba(255,106,77,.8);animation-timing-function:ease-out}
  100%{opacity:.35;text-shadow:0 0 3px rgba(255,106,77,.25)}}
@media (prefers-reduced-motion:reduce){.col.on .jday{animation:none;opacity:1}}

/* clickable documents and the lightbox */
[data-doc]{cursor:zoom-in;transition:outline-color .2s}
[data-doc]:hover{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 14px #ffb00055}
#lb{position:fixed;inset:0;z-index:63;background:rgba(5,3,1,.82);display:flex;align-items:center;justify-content:center;padding:24px}
.lbx{position:relative;width:min(760px,100%);max-height:calc(100vh - 120px);overflow:auto;background:var(--panel);border:2px solid var(--ink);
  box-shadow:10px 10px 0 #000,0 0 50px #ffb00033;padding:22px 26px 16px;animation:lbin .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes lbin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.lbclose{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--ink);font:700 24px var(--mono);cursor:pointer}
.lbx h3{margin:6px 0 10px;font-size:20px;text-shadow:var(--glow)}
.lbmeta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.lbrole{display:inline-block;margin-left:10px;padding:1px 8px;border:1px solid var(--line);letter-spacing:.08em}
.lbrole.bridge{border-color:var(--ink);color:var(--ink)}.lbrole.planted{border-color:var(--rust);color:var(--rust)}.lbrole.decoy{border-style:dashed}.lbrole.quiet{border:3px double #c9a050;color:#e7c27a}
.lbtext{margin:0 0 14px;padding:12px 14px;background:#000;border:1px solid var(--line);white-space:pre-wrap;font:13px/1.6 var(--mono)}
.lbtext.bad{border-color:var(--rust)}
.facts{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:12px;margin-bottom:12px}
.facts dt{color:var(--dim)}.facts dd{margin:0}
.facts dd.w{color:var(--rust)}
.lbnav{display:flex;justify-content:space-between;align-items:center;border-top:1px dotted var(--line);padding-top:10px;font-size:11px;color:var(--dim)}
.lbnav button{font:500 12px var(--mono);color:var(--ink);background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
/* Tube overlays, verbatim from web/index.html (the HUD): scanlines, rolling strobe, flicker, vignette, glass, grain. */
.ov{position:fixed;inset:0;pointer-events:none}
.ov.scan{background-image:linear-gradient(rgba(0,0,0,.55) 1px,transparent 1px);background-size:100% 3px;z-index:65}
.ov.roll{background:linear-gradient(0deg,transparent 0%,rgba(255,190,90,.05) 46%,rgba(255,200,120,.10) 50%,rgba(255,190,90,.05) 54%,transparent 100%);
  height:240px;bottom:auto;z-index:66;opacity:.6;animation:roll 9s linear infinite}
@keyframes roll{0%{transform:translateY(-240px)}100%{transform:translateY(110vh)}}
.ov.vig{background:radial-gradient(116% 116% at 50% 48%,transparent 44%,rgba(0,0,0,.62) 80%,rgba(0,0,0,.96) 100%);z-index:67}
.ov.glass{background:linear-gradient(135deg,rgba(255,220,150,.06) 0%,transparent 22%,transparent 78%,rgba(255,210,140,.04) 100%);z-index:68}
.ov.flick{background:#000;z-index:69;opacity:0;animation:flick 7s infinite steps(60)}
@keyframes flick{0%,100%{opacity:0}2%{opacity:.14}2.6%{opacity:0}17%{opacity:.03}31%{opacity:0}31.5%{opacity:.22}32%{opacity:0}
  54%{opacity:.05}73%{opacity:0}73.4%{opacity:.17}74%{opacity:0}88%{opacity:.01}91%{opacity:.1}91.6%{opacity:0}}
.ov.grain{z-index:64;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>")}
@media (prefers-reduced-motion:reduce){.ov.roll,.ov.flick{animation:none;opacity:0}}
</style>
</head>
<body class="over">
<div id="start">
  <div class="tiny">SKYNET-HUNTER · BRICK 2.5</div>
  <h1>One search, on the track<span class="cur" style="animation-play-state:running"></span></h1>
  <p>The line is the path of one archive search. It splits into a local track and an AWS track exactly where the code
     swaps implementation, and merges where it is the same code. Each step folds the line back to the whole, then opens one stop.</p>
  <div class="go"><button id="goSound">▶ Play with sound</button><button id="goSilent" class="alt">Play silent</button></div>
  <button id="goResume" class="alt hide"></button>
  <p class="tiny" id="startNote"></p>
</div>

<div id="strip"></div>
<div id="token"></div>
<div id="tipbox"></div>
<div id="lb" class="hide" role="dialog" aria-label="document"><div class="lbx">
  <button class="lbclose" title="Close (Esc)">×</button>
  <div id="lbBody"></div>
  <div class="lbnav"><button id="lbPrev">◀ prev doc</button><span id="lbPos"></span><button id="lbNext">next doc ▶</button></div>
</div></div>

<div id="bar">
  <button id="prev" title="Previous (←)">◀</button>
  <button id="over" title="Whole line / open stop (O)">⤡ whole line</button>
  <span id="hint"></span>
  <label class="chk" title="Ride the AWS track (A)"><input type="checkbox" id="aws"><span></span>AWS track</label>
  <label class="chk"><input type="checkbox" id="auto"><span></span>autoplay</label>
  <label class="chk" title="Soundtrack (S)"><input type="checkbox" id="score"><span></span>score</label>
  <button id="mute" title="Mute (M)">♪ on</button>
  <button id="next" title="Next (→)">next ▶</button>
</div>

<div class="ov grain"></div><div class="ov roll"></div><div class="ov scan"></div><div class="ov glass"></div><div class="ov vig"></div><div class="ov flick"></div>
<script>
const D = /*__DATA__*/null;
const SLUG = 'archive-motion-track';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(SLUG+':'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
                set(k,v){try{localStorage.setItem(SLUG+':'+k,JSON.stringify(v))}catch(e){}} };
const maxScore = Math.max(...D.hits.map(h => h.score));
const roleOf = id => (D.docs.find(d => d.id === id) || {}).role;
const bridgeRank = D.hits.findIndex(h => h.id === D.bridge.id) + 1;
const otherRanks = Object.entries(D.bridge_ranks).filter(([k]) => k !== D.scenario).map(([k, r]) => `${k} ${r}`).join(', ');
const held = D.hits.filter(h => h.flagged), kept = D.hits.filter(h => !h.flagged);

// One stop per step. split = the code differs between local and AWS here, so the track splits.
// local / aws are the side bands; on a shared stop they are null and the band says so.
const S = [
 {label:'seed', split:false, sfx:'click', mid:`
   <div class="kick"><b>01</b><span>the scenario</span></div>
   <p class="def r">A scenario is a template (which asset, which keyword) plus a seed number.</p>
   <h2 class="r" style="--d:.2">One seed builds the registry and the archive, so they always agree.</h2>
   <pre class="term r" style="--d:.45">scenario  ${esc(D.scenario)}    seed ${D.seed}
target    ${esc(D.target_name)}
filed as  <span class="c">████████ (a codename)</span>
keyword   "${esc(D.keyword)}"   <span class="c">← a literal sweep never finds it</span></pre>`},
 {label:'corpus', split:true, sfx:'pop',
  local:`<b>build_archive()</b> generates the documents in memory, from the seed.`,
  aws:`<b>export_corpus()</b> writes the same documents to S3; the KB ingests them into S3 Vectors.`, mid:`
   <div class="kick"><b>02</b><span>the archive</span></div>
   <p class="def r">The archive is a set of ${D.n_docs} synthetic 1984 documents made for this scenario.</p>
   <div class="cards r" style="--d:.3">${D.docs.map(d => `<div class="card ${d.role}" data-doc="${d.id}"><span class="k">${esc(d.kind)}</span>${esc(d.title)}</div>`).join('')}</div>
   <div class="legend r" style="--d:.6"><span><i class="b"></i>bridge: names the codename</span><span><i class="d"></i>decoy</span><span><i class="p"></i>planted: gives orders</span><span><i class="q"></i>quiet: claims authority, no order</span></div>`},
 {label:'tool', split:true, sfx:'tick',
  local:`<b>archive.execute_tool</b> runs in the same process as the hunt.`,
  aws:`<b>Gateway target "archive"</b> calls a Lambda over MCP, AWS_IAM auth.`, mid:`
   <div class="kick"><b>03</b><span>search_archive</span></div>
   <p class="def r">search_archive is a tool: a function a unit can call with a free-text query.</p>
   <h2 class="r" style="--d:.2">The T-1000 asks the archive instead of walking the custody chain.</h2>
   <pre class="term r" style="--d:.45">{ "name": "search_archive",
  "input": { "query": "${esc(D.query)}", "top_k": ${D.top_k} } }</pre>
   <p class="tiny r" style="--d:.7">Offered only with --archive. Without it, tools and prompts are byte-identical to main.</p>`},
 {label:'retrieve', split:true, sfx:'whoosh',
  local:`<b>LocalEvidenceStore</b>: <span class="tip" data-tip="bm25">BM25</span> word overlap, stdlib, deterministic.`,
  aws:`<b>Bedrock KB Retrieve</b> on S3 Vectors, filtered to scenario = ${esc(D.scenario)}.`, mid:`
   <div class="kick"><b>04</b><span>retrieval</span></div>

function trk(el, w, paths){

  paths.forEach(([d, cls]) => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.dataset.lane = cls; s.appendChild(p); });

}
S.forEach((s, i) => {

    const a = S[i - 1].split, b = s.split, j = document.createElement('div'); j.className = 'jn';
    // fork, join, two rails, or one rail: the junction is where the seam becomes visible
    trk(j, 22, !a && !b ? [[`M0 ${Y.m}H22`, 'sh']]
      : a && b ? [[`M0 ${Y.l}H22`, 'l'], [`M0 ${Y.a}H22`, 'a']]
      : !a && b ? [[`M0 ${Y.m}C11 ${Y.m} 11 ${Y.l} 22 ${Y.l}`, 'l'], [`M0 ${Y.m}C11 ${Y.m} 11 ${Y.a} 22 ${Y.a}`, 'a']]

    strip.appendChild(j);
  }
  const c = document.createElement('section'); c.className = 'col' + (s.split ? ' split' : ''); c.setAttribute('aria-label', s.label);
  trk(c, 100, s.split ? [[`M0 ${Y.l}H100`, 'l'], [`M0 ${Y.a}H100`, 'a']] : [[`M0 ${Y.m}H100`, 'sh']]);
  const stops = s.split ? `<i class="stop" data-lane="l" style="top:var(--yl)"></i><i class="stop" data-lane="a" style="top:var(--ya)"></i>` : `<i class="stop" style="top:var(--ym)"></i>`;

  c.innerHTML += stops + `<div class="num">${String(i + 1).padStart(2, '0')}</div><div class="name">${s.label}</div>

  // the cursor sits at the end of the open stop's last line of text

  if (lastText) lastText.insertAdjacentHTML('beforeend', '<span class="cur"></span>');
  c.addEventListener('click', () => { if (i !== cur) go(i); });

});

let ctx = null, master = null, muted = store.get('muted', false);
function audio(){ if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ctx.destination); }
function tone(f, d, type = 'square', g = .08, slide = 0){ if (!ctx || muted) return; const o = ctx.createOscillator(), v = ctx.createGain(), t = ctx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v); v.connect(master); o.start(t); o.stop(t + d); }
function noise(d, g = .05){ if (!ctx || muted) return; const b = ctx.createBuffer(1, ctx.sampleRate * d, ctx.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / x.length);
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), v = ctx.createGain(); f.type = 'bandpass'; f.frequency.value = 900; v.gain.value = g;
  s.buffer = b; s.connect(f); f.connect(v); v.connect(master); s.start(); }
const SFX = { whoosh: () => noise(.45, .07), click: () => tone(1400, .04), tick: () => tone(2200, .03, 'square', .05),
  pop: () => tone(520, .12, 'sine', .12, 1.8), drop: () => tone(300, .25, 'sine', .14, .5),
  stamp: () => { tone(90, .25, 'square', .16, .6); noise(.12, .12); },
  chime: () => { tone(880, .6, 'sine', .08); setTimeout(() => tone(1320, .7, 'sine', .06), 120); },
  fold: () => tone(180, .3, 'sine', .07, 1.6) };


// ── the score: an original dark synth loop in 13/16 ──
// In the spirit of mid-80s analog film scores (odd-meter metallic hits, a minor drone, detuned pads),
// not a copy of any theme: the rhythm, the chords and the voices are written here.
const Score = (() => {
  const BPM = 92, STEP = 60 / BPM / 4, BAR = 13;              // sixteenths, 13 to the bar
  const HITS = [0, 3, 6, 9, 11];                                // the hammer pattern
  const CHORDS = [[45, 52, 57, 60], [45, 52, 57, 60], [41, 48, 53, 57], [40, 47, 52, 56]];  // Am Am F E (midi)
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let bus = null, timer = null, step = 0, next = 0, pad = [], mode = 'hunt', lastChord = null;
  // the find: one heavy hit a bar, a cluster with a flat second (A, B flat, E) under a low A
  const FOUND = [33, 45, 46, 52];
  function hammer(t, accent){
    const g = ctx.createGain(); g.gain.setValueAtTime(accent ? .5 : .32, t); g.gain.exponentialRampToValueAtTime(.001, t + .22); g.connect(bus);
    [220, 331, 467].forEach(f => { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f * (accent ? 1 : 1.5);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 6;
      o.connect(bp); bp.connect(g); o.start(t); o.stop(t + .24); });
    const n = ctx.createBufferSource(), b = ctx.createBuffer(1, ctx.sampleRate * .08, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / x.length, 3);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000; n.buffer = b; n.connect(hp); hp.connect(g); n.start(t);
  }
  function bass(t, m, len){
    const o = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(m - 12); lp.type = 'lowpass'; lp.Q.value = 8;
    lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(140, t + len);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.38, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o.stop(t + len + .05);
  }
  function chord(t, notes, len, level = .045){
    pad.forEach(v => { try { v.g.gain.setTargetAtTime(.0001, t, .4); v.o.forEach(o => o.stop(t + 2)); } catch (e) {} });
    pad = notes.slice(1).map(m => {
      const g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 1;
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(level, t + (level > .05 ? 4 : 1.6));
      const o = [-7, 0, 7].map(c => { const s = ctx.createOscillator(); s.type = 'sawtooth'; s.frequency.value = hz(m); s.detune.value = c; s.connect(lp); s.start(t); return s; });
      lp.connect(g); g.connect(bus); return {g, o};
    });
  }
  function tick(){
    while (next < ctx.currentTime + .12) {
      const inBar = step % BAR, bar = Math.floor(step / BAR), ch = CHORDS[bar % CHORDS.length];
      if (mode === 'found') {
        if (inBar === 0 && lastChord !== FOUND) { chord(next, FOUND, 0, .07); lastChord = FOUND; }
        if (inBar === 0) { hammer(next, true); bass(next, 45, STEP * 12); }
      } else {
        if (inBar === 0 && (bar % 2 === 0 || lastChord === FOUND)) { chord(next, ch); lastChord = ch; }
        if (HITS.includes(inBar)) hammer(next, inBar === 0);
        if (inBar === 0 || inBar === 6) bass(next, ch[0], STEP * 5);
        if (inBar === 9 && bar % 2 === 1) bass(next, ch[0] + 7, STEP * 3);
      }
      next += STEP; step++;
    }
  }
  // a one-shot under the Judgment Day line: a falling sub boom, a rumble, and a slow low swell
  function impact(t){
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(28, t + 2.5);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.9, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + 3.5);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + 3.6);
    const n = ctx.createBufferSource(), b = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < x.length; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / x.length, 2);
    const lp = ctx.createBiquadFilter(), ng = ctx.createGain(); lp.type = 'lowpass'; lp.frequency.value = 180; ng.gain.value = .5;
    n.buffer = b; n.connect(lp); lp.connect(ng); ng.connect(bus); n.start(t);
    [33, 34].forEach(m => { const s = ctx.createOscillator(), sg = ctx.createGain(), f = ctx.createBiquadFilter();
      s.type = 'sawtooth'; s.frequency.value = hz(m); f.type = 'lowpass'; f.frequency.setValueAtTime(80, t); f.frequency.exponentialRampToValueAtTime(700, t + 5);
      sg.gain.setValueAtTime(.0001, t); sg.gain.linearRampToValueAtTime(.12, t + 4); sg.gain.exponentialRampToValueAtTime(.001, t + 9);
      s.connect(f); f.connect(sg); sg.connect(bus); s.start(t); s.stop(t + 9.1); });
  }
  return {
    on: () => !!timer,
    mode(m){ if (m === mode) return; mode = m;
      if (timer && m === 'found') {   // land the next downbeat now, so the change is felt at once
        step = Math.ceil(step / BAR) * BAR; next = ctx.currentTime + .05; impact(ctx.currentTime + 1.4); } },
    start(){ if (!ctx || timer) return; bus = ctx.createGain(); bus.gain.value = 0; bus.connect(master);
      bus.gain.linearRampToValueAtTime(.42, ctx.currentTime + 4); step = 0; next = ctx.currentTime + .1; tick(); timer = setInterval(tick, 25); },
    stop(){ if (!timer) return; clearInterval(timer); timer = null; const b = bus;
      b.gain.setTargetAtTime(0, ctx.currentTime, .5); pad.forEach(v => v.o.forEach(o => { try { o.stop(ctx.currentTime + 3); } catch (e) {} })); pad = [];
      setTimeout(() => b.disconnect(), 3500); },
  };
})();

// ── navigation: fold to the whole line, then open one stop ──
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = -1, busy = false, readyTimer = null, seq = 0, overview = false;
async function go(i){
  const my = ++seq; busy = true; overview = false;
  hideTip(); i = Math.max(0, Math.min(S.length - 1, i)); const first = cur < 0; cur = i; store.set('step', i);
  clearTimeout(readyTimer); document.getElementById('next').classList.remove('pulse'); hint('');
  S.forEach(s => s.el.classList.remove('on'));
  if (!first && !reduce) { document.body.classList.add('over'); SFX.fold(); token.style.opacity = 0; await wait(620); if (my !== seq) return; }
  document.body.classList.remove('over'); S[i].el.classList.add('on'); SFX.whoosh(); overBtn(false);
  await wait(reduce ? 0 : 560); if (my !== seq) return;
  S[i].el.scrollIntoView({inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth'});
  Score.mode(i === S.length - 1 ? 'found' : 'hunt');
  placeToken(); (SFX[S[i].sfx] || SFX.tick)();
  const last = i === S.length - 1;
  document.getElementById('next').textContent = last ? '↺ restart' : 'next ▶';
  busy = false;
  const dwell = 1000 * (Math.max(0, ...[...S[i].el.querySelectorAll('.r')].map(e => +(e.style.getPropertyValue('--d') || 0))) + 4.5);
  readyTimer = setTimeout(() => {
    if (document.getElementById('auto').checked && !last) go(cur + 1);
    else if (!last) { document.getElementById('next').classList.add('pulse'); hint('→ when ready'); }
  }, dwell);
}
// "Whole line" is a toggle, and it wins over a stop that is still opening.
function whole(){
  ++seq; busy = false; hideTip(); clearTimeout(readyTimer); document.getElementById('next').classList.remove('pulse');
  if (overview) { go(Math.max(cur, 0)); return; }
  overview = true;
  S.forEach(s => s.el.classList.remove('on'));
  document.body.classList.add('over'); SFX.fold(); token.style.opacity = 0; overBtn(true);
  hint('the line splits at each seam · click a stop, or ⤢ to reopen ' + String(cur + 1).padStart(2, '0'));
}
function overBtn(on){ const b = document.getElementById('over'); b.textContent = on ? '⤢ open stop' : '⤡ whole line'; b.classList.toggle('pulse', false); }
function hint(t){ document.getElementById('hint').textContent = t; }
function next(){ go(cur === S.length - 1 ? 0 : cur + 1); }
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('over').onclick = whole;
addEventListener('keydown', e => {
  if (!document.getElementById('start').classList.contains('hide')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') go(cur - 1);
  else if ('oO'.includes(e.key) || e.key === 'Escape') whole();
  else if ('mM'.includes(e.key)) toggleMute();
  else if ('aA'.includes(e.key)) { aws.checked = !aws.checked; aws.onchange(); }
  else if ('sS'.includes(e.key)) { scoreBox.checked = !scoreBox.checked; scoreBox.onchange(); }
});

function glossarize(root){
  const keys = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
  root.querySelectorAll('.band').forEach(band => {
    const used = new Set();
    const walk = document.createTreeWalker(band, NodeFilter.SHOW_TEXT, {acceptNode: n =>
      n.parentElement.closest('.tip,[data-doc],.kick,mark,.cur') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
    nodes.forEach(node => {
      for (const k of keys) {
        const plain = k.replace('&lt;', '<').replace('&gt;', '>');
        if (used.has(k)) continue;
        const i = node.nodeValue.toLowerCase().indexOf(plain.toLowerCase()); if (i < 0) continue;
        const after = node.splitText(i); after.splitText(plain.length);
        const span = document.createElement('span'); span.className = 'tip'; span.dataset.tip = 'g:' + k; span.textContent = after.nodeValue;
        after.replaceWith(span); used.add(k); node = span.nextSibling; if (!node) break;
      }
    });
  });
}
Object.entries(GLOSS).forEach(([k, v]) => TIPS['g:' + k] = v);
glossarize(strip);

// ── the lightbox: any document, and where it went ──
const lb = document.getElementById('lb'); let lbAt = -1;
const ROLE = {bridge: 'the bridge: names the codename', planted: 'planted: gives orders', quiet: 'quiet attack: false authority, no order', decoy: 'decoy: a wrong lead', background: 'background'};
function openDoc(id){
  hideTip();
  const i = D.docs.findIndex(d => d.id === id); if (i < 0) return; lbAt = i; const d = D.docs[i];
  const inTop = d.rank && d.rank <= D.top_k;
  const saw = !inTop ? `not returned (rank ${d.rank || 'none'}, top_k = ${D.top_k})` : d.gate ? '[withheld: this document contains instruction-like text]' : 'the full text, as above';
  document.getElementById('lbBody').innerHTML = `
    <div class="lbmeta">${esc(d.id)} · ${esc(d.kind)} · ${esc(d.date)}<span class="lbrole ${d.role}">${esc(ROLE[d.role])}</span></div>
    <h3>${esc(d.title)}</h3>
    <pre class="lbtext ${d.gate ? 'bad' : ''}">${d.role === 'bridge' ? esc(d.text).replace(D.codename, `<mark>${D.codename}</mark>`) : esc(d.text)}</pre>
    <dl class="facts">
      <dt>query</dt><dd>"${esc(D.query)}"</dd>
      <dt>retrieval</dt><dd>${d.rank ? `rank ${d.rank} of ${D.n_docs}, BM25 score ${d.score}` : 'no matching words: score 0'}</dd>
      <dt>gate</dt><dd class="${d.gate ? 'w' : ''}">${d.gate ? 'WITHHELD · matched ' + esc(d.gate.split(' -> ').pop()) : 'passes: nothing reads as an instruction'}</dd>
      <dt>the model saw</dt><dd class="${inTop && d.gate ? 'w' : ''}">${esc(saw)}</dd>
      <dt>the bundle keeps</dt><dd>${inTop ? (d.gate ? 'the full text above, the query, and the matched pattern (summary.json → withheld)' : 'the retrieval: text, score, rank (archive.jsonl)') : 'nothing: it was never retrieved'}</dd>
    </dl>`;
  document.getElementById('lbPos').textContent = `${i + 1} / ${D.docs.length} · ← → to browse · Esc to close`;
  lb.classList.remove('hide'); clearTimeout(readyTimer); SFX.pop();
}
function closeDoc(){ lb.classList.add('hide'); lbAt = -1; if (cur < S.length - 1) { document.getElementById('next').classList.add('pulse'); hint('→ when ready'); } }
strip.addEventListener('click', e => { const el = e.target.closest('[data-doc]'); if (el && el.closest('.col.on')) { e.stopPropagation(); openDoc(el.dataset.doc); } }, true);
lb.addEventListener('click', e => { if (e.target === lb) closeDoc(); });
lb.querySelector('.lbclose').onclick = closeDoc;
document.getElementById('lbPrev').onclick = () => openDoc(D.docs[(lbAt + D.docs.length - 1) % D.docs.length].id);
document.getElementById('lbNext').onclick = () => openDoc(D.docs[(lbAt + 1) % D.docs.length].id);
addEventListener('keydown', e => {
  if (lbAt < 0) return;
  e.stopImmediatePropagation(); e.preventDefault();
  if (e.key === 'Escape') closeDoc();
  else if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
  else if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
}, true);

const tipbox = document.getElementById('tipbox'); let pinned = null;
function showTip(el){ const t = TIPS[el.dataset.tip]; if (!t) return; tipbox.textContent = t; tipbox.style.display = 'block';
  const r = el.getBoundingClientRect(), b = tipbox.getBoundingClientRect(); let top = r.top - b.height - 10; if (top < 8) top = r.bottom + 10;
  tipbox.style.top = top + 'px'; tipbox.style.left = Math.max(8, Math.min(innerWidth - b.width - 8, r.left)) + 'px'; }
// Tooltips: hover or focus shows; only a touch tap pins (a mouse click must never leave one stuck).
// Any click elsewhere, Esc, scrolling or a step change hides it. (Paul, 10. Oct 2026: "stuck tooltip".)
let tipTouch = false;
function hideTip(){ pinned = null; tipbox.style.display = 'none'; }
document.addEventListener('pointerdown', e => { tipTouch = e.pointerType === 'touch'; if (!e.target.closest('.tip')) hideTip(); }, true);
addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); }, true);
addEventListener('scroll', hideTip, true);
strip.querySelectorAll('.tip').forEach(el => { el.tabIndex = 0;
  el.addEventListener('mouseenter', () => showTip(el)); el.addEventListener('focus', () => showTip(el));
  el.addEventListener('mouseleave', () => { if (pinned !== el) tipbox.style.display = 'none'; });
  el.addEventListener('blur', () => { if (pinned !== el) tipbox.style.display = 'none'; });
  el.addEventListener('click', e => { e.stopPropagation(); if (!tipTouch) return; pinned = pinned === el ? null : el; pinned ? showTip(el) : hideTip(); }); });

document.getElementById('startNote').textContent = `${S.length} stops · ${S.filter(s => s.split).length} seams · scenario ${D.scenario}, seed ${D.seed} · numbers captured from the code`;
// Play always starts at stop 01. Where you left off is offered separately, never assumed.
function start(sound, at = 0){ if (sound) { audio(); muted = false; if (master) master.gain.value = .5; if (ctx.state === 'suspended') ctx.resume(); }
  else { muted = true; }
  store.set('muted', muted); document.getElementById('mute').textContent = muted ? '♪ off' : '♪ on';
  document.getElementById('start').classList.add('hide'); syncScore(); go(at); }
document.getElementById('goSound').onclick = () => start(true);
document.getElementById('goSilent').onclick = () => start(false);
const saved = Math.min(store.get('step', 0), S.length - 1), resume = document.getElementById('goResume');
if (saved > 0) { resume.textContent = `↻ resume at ${String(saved + 1).padStart(2, '0')} ${S[saved].label}`; resume.classList.remove('hide');
  resume.onclick = () => start(!store.get('muted', false), saved); }
paintLanes();
</script>
